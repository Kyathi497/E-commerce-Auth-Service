# auth-service with its own database. Emails go out over the SMTP server set in .env.
#   docker network create tej-net        # once per machine, shared by all services
#   docker compose up --build
# Service: http://localhost:4001
#
# For hot reload, run only the infrastructure here and the service on your machine:
#   docker compose up mysql
#   pnpm dev
name: tej-auth

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3307:3306" # 3307 on the host, to stay clear of a local MySQL
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  auth-service:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: "3306"
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth
      MYSQL_DATABASE: auth
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "4001:4001"
    networks:
      - default
      - tej-net # the api-gateway reaches it here as http://auth-service:4001
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

networks:
  tej-net:
    external: true

volumes:
  mysql-data:
